<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinWise</title>
<meta name="description" content="FinWise: pendamping keuangan anak muda Indonesia. Cek kondisi keuangan, pilih pinjaman legal yang aman, dan pulih dari utang.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* layout idea: one financial journey as a rail (CEK → PILAH → PULIH) across the top; each stage page reads summary-first, numbers large, zones in colour */
:root{
  --paper:#F2F6F3; --card:#FFFFFF; --ink:#13231B; --muted:#56675E; --line:#D9E3DD; --soft:#EAF1EC;
  --green:#1E6B4E; --green-ink:#FFFFFF; --green-tint:#E3F0E8;
  --amber:#94590A; --amber-strong:#E09A2D; --amber-tint:#FBF0DC;
  --deep:#134A36; --deep-tint:#DCEBE3;
  --pulih:#1F5F7A; --pulih-strong:#2B7FA3; --pulih-tint:#E1EEF3; --on-stage:#FFFFFF;
  --orange:#B4470F; --orange-tint:#FDEBDF;
  --safe:#167349; --safe-tint:#E1F3E8; --stretch:#8C5A07; --stretch-tint:#FCEFD6; --danger:#B8302A; --danger-tint:#FBE6E4;
  --shadow:0 1px 2px rgba(19,35,27,.06),0 8px 24px rgba(19,35,27,.06);
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-sm:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1512; --card:#141F1A; --ink:#E3ECE6; --muted:#9BACA3; --line:#26352D; --soft:#1A2822;
  --green:#5DBE92; --green-ink:#0D1512; --green-tint:#17322A;
  --amber:#EDAA45; --amber-strong:#EDAA45; --amber-tint:#33270F;
  --deep:#7FD1AB; --deep-tint:#163027;
  --pulih:#7CC3DD; --pulih-strong:#7CC3DD; --pulih-tint:#15303A; --on-stage:#0D1512;
  --orange:#F29A62; --orange-tint:#3A2213;
  --safe:#4CC48A; --safe-tint:#15301F; --stretch:#E8A43C; --stretch-tint:#33260E; --danger:#F07B70; --danger-tint:#3A1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0D1512; --card:#141F1A; --ink:#E3ECE6; --muted:#9BACA3; --line:#26352D; --soft:#1A2822;
  --green:#5DBE92; --green-ink:#0D1512; --green-tint:#17322A;
  --amber:#EDAA45; --amber-strong:#EDAA45; --amber-tint:#33270F;
  --deep:#7FD1AB; --deep-tint:#163027;
  --pulih:#7CC3DD; --pulih-strong:#7CC3DD; --pulih-tint:#15303A; --on-stage:#0D1512;
  --orange:#F29A62; --orange-tint:#3A2213;
  --safe:#4CC48A; --safe-tint:#15301F; --stretch:#E8A43C; --stretch-tint:#33260E; --danger:#F07B70; --danger-tint:#3A1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:0.9375rem;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.750rem,4.2vw,2.750rem);font-weight:800}
h2{font-size:1.375rem;font-weight:800}
h3{font-size:1.0625rem;font-weight:700}
p{margin:0}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber-strong);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:0.8125rem}
.tiny{font-size:0.75rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
@media (max-width:480px){.wrap{padding:0 16px}}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ---------- header & journey rail ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.375rem;letter-spacing:-.03em;text-decoration:none;color:var(--ink)}
.logo .fin{color:var(--green)} .logo .wise{color:var(--amber)}
.rail{display:flex;align-items:stretch;flex:1;min-width:0;gap:0;margin:0 4px}
.rail a{position:relative;flex:1;text-decoration:none;color:var(--muted);padding:8px 14px 8px 30px;min-width:0;border-radius:12px}
.rail a::before{content:"";position:absolute;left:12px;top:15px;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.rail a + a::after{content:"";position:absolute;left:-14px;top:20px;width:24px;height:2px;background:var(--line)}
.rail b{display:block;font-family:var(--display);font-weight:800;font-size:0.875rem;letter-spacing:.02em;color:var(--ink)}
.rail span{display:block;font-size:0.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail a:hover{background:var(--soft)}
.rail a[data-stage="cek"].on::before{background:var(--green);border-color:var(--green)}
.rail a[data-stage="pilah"].on::before{background:var(--amber-strong);border-color:var(--amber-strong)}
.rail a[data-stage="pulih"].on::before{background:var(--deep);border-color:var(--deep)}
.rail a.on{background:var(--card);box-shadow:var(--shadow)}
.navx{display:flex;gap:6px;align-items:center}
.navx a{font-weight:700;font-size:0.875rem;text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:10px}
.navx a.on,.navx a:hover{background:var(--soft)}
.navx a.os{color:var(--green)}
.who{display:flex;align-items:center;gap:8px}
.who select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-weight:600;font-size:0.8125rem}
@media (max-width:900px){
  .top .wrap{gap:8px;padding-top:8px;padding-bottom:8px}
  .rail{order:3;flex-basis:100%;overflow-x:auto;margin:0}
  .rail a{flex:0 0 auto;min-width:150px}
  .navx{order:2;margin-left:auto}
  .who{order:4;flex-basis:100%}
  .who select{flex:1}
}

/* ---------- generic ---------- */
main{padding:28px 0 64px;min-height:70vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:900px){.g2,.g3,.g-side{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid > *{min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--green);color:var(--green-ink);text-decoration:none;font-size:0.875rem;line-height:1.2}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.amber{background:var(--amber-strong);color:#1d1403}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:7px 12px;font-size:0.8125rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:0.75rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.z-safe{background:var(--safe-tint);color:var(--safe)} .z-stretch{background:var(--stretch-tint);color:var(--stretch)} .z-danger{background:var(--danger-tint);color:var(--danger)} .z-orange{background:var(--orange-tint);color:var(--orange)}
.z-grey{background:var(--soft);color:var(--muted)} .z-green{background:var(--green-tint);color:var(--green)} .z-amber{background:var(--amber-tint);color:var(--amber)}
.kpi .k{font-size:0.7812rem;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:0.7812rem;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(2.125rem,5vw,3.000rem);letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.lab{font-size:0.7812rem;font-weight:700;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:4px 0}
.note{background:var(--soft);border-radius:var(--r-sm);padding:12px 14px;font-size:0.8438rem}
.note.amber{background:var(--amber-tint)} .note.danger{background:var(--danger-tint)} .note.safe{background:var(--safe-tint)}
.tag{font-size:0.7188rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:2px 7px}

/* page heads */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.phead .eyebrow{font-weight:800;font-size:0.8125rem;letter-spacing:.04em;margin-bottom:6px}
.e-cek{color:var(--green)} .e-pilah{color:var(--amber)} .e-pulih{color:var(--pulih)} .e-os{color:var(--green)}
.phead p{color:var(--muted);max-width:62ch;margin-top:6px}
.who-card{display:flex;max-width:100%;flex-wrap:wrap;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-family:var(--display);flex:none}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:0.8125rem;font-weight:700;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;font-weight:600;color:var(--ink);min-width:0;width:100%}
.in:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px var(--green-tint)}
.rp{position:relative}
.rp .in{padding-left:34px}
.rp::before{content:"Rp";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);font-size:0.8125rem}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:0.875rem;cursor:pointer}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--green)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:700;font-size:0.8125rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:0.8438rem}
th{text-align:left;font-size:0.75rem;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--soft);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.sel td{background:var(--amber-tint)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}

/* zone bar */
.zbar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--soft)}
.zbar i{display:block;height:100%}
.zmark{position:relative;height:18px}
.zmark span{position:absolute;top:0;transform:translateX(-50%);font-size:0.6875rem;font-weight:800;white-space:nowrap}
.zlabels{display:flex;font-size:0.7188rem;font-weight:800;margin-top:6px}

/* month strip */
.month{position:relative;height:64px;margin:6px 6px 0}
.month .ln{position:absolute;left:0;right:0;top:30px;height:4px;border-radius:3px;background:var(--soft)}
.month .mk{position:absolute;top:22px;width:20px;height:20px;border-radius:50%;transform:translateX(-50%);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.month .tx{position:absolute;top:0;transform:translateX(-50%);font-size:0.6875rem;font-weight:800;white-space:nowrap}
.month .dd{position:absolute;top:46px;transform:translateX(-50%);font-size:0.6875rem;font-weight:700;color:var(--muted)}

/* steps (PILAH) */
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.steps button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px 7px 8px;font-weight:700;font-size:0.8438rem;cursor:pointer;color:var(--muted)}
.steps button i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--soft);font-size:0.75rem;font-weight:800}
.steps button.on{color:var(--ink);border-color:var(--amber-strong)}
.steps button.on i{background:var(--amber-strong);color:#1d1403}
.steps button.done i{background:var(--safe);color:#fff}

/* ladder */
.rung{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rung:first-child{border-top:0}
.rung .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--soft);font-size:0.8125rem}
.rung.used .n{background:var(--safe);color:#fff}
.rung.cur .n{background:var(--amber-strong);color:#1d1403}
.rung.dim{opacity:.62}
.rung .rin{width:150px}
@media (max-width:520px){.rung{grid-template-columns:30px minmax(0,1fr)}.rung > :last-child{grid-column:2}.rung .rin{width:100%}}
.prog{height:12px;border-radius:8px;background:var(--amber-tint);overflow:hidden;display:flex}
.prog i{display:block;height:100%;background:var(--safe)}

/* options */
.opt{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.opt.best{border:2px solid var(--safe)}
.opt.picked{outline:3px solid var(--amber-strong);outline-offset:2px}
.opt .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt .facts > div{background:var(--soft);border-radius:10px;padding:8px 10px}
.opt .facts .k{font-size:0.7188rem;color:var(--muted);font-weight:700}
.opt .facts .v{font-weight:800;font-variant-numeric:tabular-nums;font-size:0.9062rem}
@media (max-width:560px){.opt .facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rank{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--soft);flex:none}
.opt.best .rank{background:var(--safe);color:#fff}

/* score ring */
.ring{--p:0;--c:var(--green);width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring > div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--display);font-size:2.25rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;padding:12px 0 32px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p.lead{font-size:1.0625rem;color:var(--muted);margin:14px 0 22px;max-width:52ch}
.demo{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.demo .need{font-family:var(--display);font-weight:800;font-size:clamp(1.875rem,4vw,2.500rem);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.demo .need s{color:var(--muted);text-decoration-thickness:3px;text-decoration-color:var(--danger);font-size:.6em;margin-right:10px}
.demo .stp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line);font-size:0.875rem}
.demo .stp i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:0.75rem;background:var(--safe);color:#fff}
.demo .stp.last i{background:var(--amber-strong);color:#1d1403}
@media (prefers-reduced-motion:no-preference){
  .demo .stp{animation:rise .5s both}
  .demo .stp:nth-child(2){animation-delay:.25s}.demo .stp:nth-child(3){animation-delay:.5s}.demo .stp:nth-child(4){animation-delay:.75s}
  .demo .need s{animation:strike .6s 1s both}
}
@keyframes rise{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes strike{from{text-decoration-color:transparent}to{text-decoration-color:var(--danger)}}
.stage-card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit}
.stage-card .q{font-family:var(--display);font-weight:800;font-size:1.1875rem}
.stage-card .tagline{font-weight:800;letter-spacing:.04em;font-size:0.8125rem}

/* overlay & sheets */
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--paper);width:min(660px,100%);height:100%;overflow:auto;padding:22px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.sheet.center{margin:auto;height:auto;max-height:92vh;border-radius:20px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;font-size:0.875rem}
.msg.me{align-self:flex-end;background:var(--green);color:var(--green-ink)}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ai-out{white-space:pre-wrap;font-size:0.875rem;background:var(--card);border:1px dashed var(--green);border-radius:12px;padding:12px 14px}

/* test mode */
.quiz{display:flex;flex-direction:column;gap:18px}
.qq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.qq .opts{display:grid;gap:8px;margin-top:10px}
.qq label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600;font-size:0.875rem}
.qq label:has(input:checked){border-color:var(--green);background:var(--green-tint)}
.qq input{accent-color:var(--green)}
.testbar{position:sticky;top:64px;z-index:15;background:var(--amber-tint);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.gate{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.75rem;word-break:break-all;background:var(--soft);border-radius:10px;padding:10px}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:0.7812rem;color:var(--muted)}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;font-size:0.875rem;z-index:60}

/* ---------- accessibility & new components ---------- */
.skip{position:fixed;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.skip:focus{top:12px}
main:focus{outline:none}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,#profile:focus{outline:none}
.linkbtn{background:none;border:0;padding:0;color:var(--green);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font:inherit;text-align:left}
td .linkbtn{color:var(--ink);text-decoration:none} td .linkbtn:hover{text-decoration:underline}
.linkcard{display:block;text-align:left;border:1px solid var(--line);cursor:pointer;color:inherit;font:inherit;width:100%}

<body>
<div id="app"><noscript>FinWise membutuhkan JavaScript.</noscript></div>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<script>/* ===== FinWise engine: pure functions, no DOM ===== */
const FW = (() => {
  const sum = (a, f = x => x) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const round = x => Math.round(x);

  function rp(n, opt = {}) {
    const neg = n < 0; const v = Math.round(Math.abs(n));
    const s = 'Rp' + v.toLocaleString('id-ID');
    return (neg ? '−' : (opt.plus && n > 0 ? '+' : '')) + s;
  }
  function rpShort(n) {
    const neg = n < 0, v = Math.abs(n);
    let s;
    if (v >= 1e9) s = (v / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' M';
    else if (v >= 1e6) s = (v / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' jt';
    else if (v >= 1e3) s = Math.round(v / 1e3).toLocaleString('id-ID') + ' rb';
    else s = String(Math.round(v));
    return (neg ? '−' : '') + 'Rp' + s;
  }
  const pct = (x, d = 1) => (x * 100).toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';

  /* ---------- profile basics ---------- */
  const income = p => sum(p.incomes, i => i.amount);
  const instalments = p => sum(p.loans, l => l.instalment);
  // a single 'total' estimate counts as essential spending (the conservative reading) until the user breaks it down
  const needs = p => sum(p.spending.filter(c => c.kind === 'need' || c.kind === 'total'), c => c.amount);
  const wants = p => sum(p.spending.filter(c => c.kind === 'want'), c => c.amount);
  const spendTotal = p => needs(p) + wants(p);
  const surplus = p => income(p) - spendTotal(p) - (p.family || 0) - instalments(p);

  /* ---------- PILAH: headroom ---------- */
  function headroom(p) {
    const inc = income(p), ex = instalments(p), sur = surplus(p);
    // planned monthly saving is protected: new instalments may only use what is left after it
    const save = Math.max(0, Math.min(p.savingMonthly || 0, sur));
    const lens1 = 0.30 * inc - ex;
    const lens2 = 0.70 * (sur - save);
    const ceiling = Math.max(0, Math.min(lens1, lens2));
    const stretchMax = Math.max(0, Math.min(0.40 * inc - ex, sur));
    return { inc, ex, sur, save, dsrNow: inc ? ex / inc : 0, lens1, lens2, ceiling, stretchMax,
      binding: lens1 <= lens2 ? 'dsr' : 'cash' };
  }
  function zoneOf(p, inst) {
    const h = headroom(p);
    const dsr = h.inc ? (h.ex + inst) / h.inc : 1;
    const left = h.sur - inst;
    let zone;
    if (dsr > 0.40 || left < 0) zone = 'danger';
    else if (dsr > 0.30 || inst > h.ceiling + 0.5) zone = 'stretch';
    else zone = 'safe';
    return { zone, dsr, left };
  }

  /* ---------- loan maths (flat add-on, as Indonesian lenders quote) ---------- */
  function loan({ principal, rate, unit, months, feePct = 0, maxTotal }) {
    principal = Number(principal) || 0; months = Math.round(Number(months) || 0); rate = Number(rate) || 0;
    if (principal <= 0 || months <= 0) return { interest: 0, fee: 0, inst: 0, total: 0, ear: 0, repay: 0, empty: true };
    const days = months * 30;
    let interest = unit === 'day' ? principal * rate * days : principal * rate * months;
    let fee = principal * feePct;
    // OJK caps the whole economic benefit (interest + fees); a published maximum above the cap cannot legally be charged
    if (maxTotal != null && interest + fee > maxTotal) { fee = Math.min(fee, maxTotal); interest = Math.max(0, maxTotal - fee); }
    const inst = (principal + interest) / months;
    const total = interest + fee;
    // effective annual rate (EAR, compounded) from the cash-flow schedule: receive principal-fee, pay inst x months
    let lo = 0, hi = 1;
    for (let k = 0; k < 120; k++) {
      const r = (lo + hi) / 2; let pv = 0;
      for (let m = 1; m <= months; m++) pv += inst / Math.pow(1 + r, m);
      if (pv > principal - fee) lo = r; else hi = r;
    }
    const ear = Math.pow(1 + lo, 12) - 1;
    return { interest, fee, inst, total, ear, repay: principal + interest };
  }

  /* ---------- CEK: health score (8 indicators x 12.5) ---------- */
  function health(p) {
    const inc = income(p), outflow = spendTotal(p) + (p.family || 0) + instalments(p);
    const sav = p.savingMonthly || 0;
    const balance = surplus(p);
    const savingsRate = inc ? Math.max(0, Math.min(sav, sav + Math.min(0, balance))) / inc : 0;
    const realSaving = balance < 0 ? 0 : savingsRate;
    const h = headroom(p);
    const ind = [
      { pillar: 'Spend', key: 'savings', label: 'Rasio menabung ≥ 10% pendapatan', score: clamp(realSaving / 0.10, 0, 1) },
      { pillar: 'Spend', key: 'ontime', label: 'Semua tagihan dibayar tepat waktu', score: p.onTime ? 1 : 0 },
      { pillar: 'Save', key: 'buffer', label: 'Dana darurat ≥ 3 bulan pengeluaran', score: outflow ? clamp((p.emergencyFund || 0) / (3 * outflow), 0, 1) : 0 },
      { pillar: 'Save', key: 'regular', label: 'Menabung rutin setiap bulan', score: (sav > 0 && balance >= 0) ? 1 : 0 },
      { pillar: 'Borrow', key: 'dsr', label: 'Rasio cicilan (DSR) ≤ 30%', score: h.dsrNow <= 0.30 ? 1 : h.dsrNow <= 0.40 ? 0.5 : 0 },
      { pillar: 'Borrow', key: 'slik', label: 'Status SLIK lancar / tanpa catatan buruk', score: { lancar: 1, kosong: 1, tidaktahu: 0.5, dpk: 0.5, macet: 0 }[p.slik] ?? 0.5 },
      { pillar: 'Plan', key: 'insurance', label: 'Punya jaminan kesehatan (BPJS/asuransi)', score: p.insurance ? 1 : 0 },
      { pillar: 'Plan', key: 'plan', label: 'Punya rencana/target keuangan aktif', score: p.plan ? 1 : 0 },
    ];
    ind.forEach(i => i.points = i.score * 12.5);
    const total = Math.round(sum(ind, i => i.points));
    // a monthly deficit can never read as 'coping', whatever the habit points add up to
    const deficit = balance < 0;
    const status = deficit ? 'Rentan' : total >= 80 ? 'Sehat' : total >= 40 ? 'Bertahan' : 'Rentan';
    const weakest = [...ind].sort((a, b) => a.points - b.points)[0];
    return { total, status, ind, weakest, deficit };
  }

  /* ---------- CEK: cash runway (first day the balance goes below zero) ---------- */
  function runway(p) {
    // the month is simulated from the main income's payday (day 1 of the cycle), so a salary on the 25th is handled correctly
    const main = [...p.incomes].sort((a, b) => b.amount - a.amount)[0];
    const offset = ((main && main.payday) || 1) - 1;
    const cyc = d => ((d - 1 - offset + 300) % 30) + 1;
    const days = 30; let bal = p.openingBalance || 0;
    const incomeByDay = Array(days + 1).fill(0), spendByDay = Array(days + 1).fill(0);
    p.incomes.forEach(i => (i.split || [[i.payday || 1, 1]]).forEach(([d, f]) => incomeByDay[cyc(d)] += i.amount * f));
    const weights = []; for (let d = 1; d <= days; d++) { const dow = (d + 2) % 7; weights[d] = (dow === 5 || dow === 6) ? 1.7 : 1; }
    const wsum = sum(weights.slice(1));
    p.spending.forEach(c => { if (c.day) spendByDay[cyc(c.day)] += c.amount; else for (let d = 1; d <= days; d++) spendByDay[d] += c.amount * weights[d] / wsum; });
    p.loans.forEach(l => spendByDay[cyc(l.dueDay || 1)] += l.instalment);
    if (p.family) spendByDay[1] += p.family;
    if (p.savingMonthly && surplus(p) >= 0) spendByDay[30] += p.savingMonthly; // saved at the end of the cycle from what is left
    for (let d = 1; d <= days; d++) { bal += incomeByDay[d] - spendByDay[d]; if (bal < -1) return { day: d, date: ((d - 1 + offset) % 30) + 1, from: offset + 1 }; }
    return null;
  }

  /* ---------- CEK: 50/30/20 split ---------- */
  function split(p) {
    const inc = income(p) || 1;
    const debt = instalments(p);
    return { need: (needs(p) + (p.family || 0)) / inc, want: wants(p) / inc, debt: debt / inc,
             save: Math.max(0, surplus(p)) / inc };
  }

  /* ---------- CEK: AI-free insight rules (figures only from the engine) ---------- */
  function cutSuggestions(p) {
    const out = [];
    p.spending.filter(c => c.kind === 'want').forEach(c => {
      if (c.cap != null && c.amount > c.cap) out.push({ cat: c.name, from: c.amount, to: c.cap, save: c.amount - c.cap, why: c.capWhy });
    });
    return out;
  }

  /* ---------- CEK: goal plan ---------- */
  function goalPlan(target, phases) {
    // phases: [{months, monthly}] last phase repeats
    let acc = 0, m = 0; const series = [];
    while (acc < target && m < 120) {
      let idx = 0, cum = 0;
      for (let i = 0; i < phases.length; i++) { cum += phases[i].months || Infinity; if (m < cum) { idx = i; break; } idx = i; }
      acc += phases[idx].monthly; m++; series.push(Math.round(acc));
    }
    return { months: m, series };
  }

  /* ---------- Kesiapan berutang: one verdict for the whole app ---------- */
  // cheapest legal pricing used to turn the safe instalment into a loan size (flat add-on per month)
  const SAFE_RATE = 0.015;
  function maxSafeLoan(p, months, r = SAFE_RATE) {
    const c = headroom(p).ceiling;
    if (c <= 0 || months <= 0) return 0;
    return Math.floor(c * months / (1 + r * months) / 10000) * 10000;
  }
  const unstableIncome = p => p.stability === 'tidak' || (p.incomes.some(i => i.type && i.type !== 'tetap') && p.stability !== 'sangat');
  function readiness(p) {
    const inc = income(p), h = headroom(p), sur = h.sur, n = p.loans.length;
    const outflow = spendTotal(p) + (p.family || 0) + h.ex;
    const efM = outflow ? (p.emergencyFund || 0) / outflow : 0, efTarget = unstableIncome(p) ? 6 : 3;
    const spendR = inc ? outflow / inc : 1;
    const max = { 3: maxSafeLoan(p, 3), 6: maxSafeLoan(p, 6), 12: maxSafeLoan(p, 12) };
    const base = { h, sur, efM, efTarget, spendR, max, n, rate: SAFE_RATE };
    const run = sur > 0 ? runway(p) : null;
    const r0 = [];
    if (!inc) r0.push('Belum ada pemasukan yang tercatat.');
    else if (sur < 0) r0.push(`Pengeluaranmu lebih besar dari pemasukan: tekor ${rp(-sur)} per bulan.`);
    else if (sur === 0) r0.push('Pemasukanmu habis tepat untuk pengeluaran, tanpa sisa.');
    if (h.dsrNow > 0.40) r0.push(`Cicilanmu sudah ${pct(h.dsrNow, 0)} dari pendapatan, di atas batas bahaya 40%.`);
    if (p.slik === 'macet' || p.pinjolExp === 'masalah') r0.push('Ada riwayat telat bayar atau kredit bermasalah yang perlu dipulihkan dulu.');
    if (run) r0.push(`Uangmu habis sebelum gajian berikutnya (sekitar tanggal ${run.date}).`);
    if (inc && sur > 0 && h.dsrNow <= 0.40 && h.ceiling <= 0) r0.push('Setelah cicilan lama dan tabungan rutin, tidak ada ruang untuk cicilan baru.');
    if (r0.length) return { ...base, level: 0, reasons: r0 };
    const r1 = [];
    if (spendR > 0.90) r1.push(`${pct(spendR, 0)} pendapatanmu sudah terpakai (patokan bahaya: 90% ke atas).`);
    if (h.dsrNow > 0.30) r1.push(`Cicilanmu ${pct(h.dsrNow, 0)} dari pendapatan, di atas batas aman 30%.`);
    if (efM < 1) r1.push('Dana daruratmu belum cukup untuk 1 bulan pengeluaran.');
    if (max[6] < 0.10 * inc) r1.push(`Pinjaman yang aman sangat kecil: maksimal ${rpShort(max[6])} untuk 6 bulan.`);
    if (n >= 4) r1.push(`Kamu sudah punya ${n} kredit aktif; menambah satu lagi memperbesar risiko gali lubang.`);
    if (r1.length) return { ...base, level: 1, reasons: r1 };
    const r2 = [];
    if (efM < efTarget) r2.push(`Dana daruratmu ${efM.toLocaleString('id-ID', { maximumFractionDigits: 1 })} bulan, belum mencapai target ${efTarget} bulan.`);
    if (spendR > 0.80) r2.push(`${pct(spendR, 0)} pendapatanmu terpakai (patokan wajar: 80% ke bawah).`);
    if (r2.length) return { ...base, level: 2, reasons: r2 };
    return { ...base, level: 3, reasons: ['Arus uang, porsi cicilan, dan dana daruratmu sudah di zona sehat.'] };
  }

  /* ---------- PILAH: funding ladder ---------- */
  function ladder(need, rungs) {
    let left = need; const steps = [];
    rungs.forEach(r => { const use = Math.min(left, Math.max(0, r.amount || 0)); left -= use; steps.push({ ...r, use, leftAfter: left }); });
    return { gap: left, steps, covered: need - left };
  }

  /* ---------- PILAH: smart loan match ---------- */
  const WEIGHTS = {
    seimbang: { cost: .35, health: .30, rep: .15, privacy: .10, speed: .10 },
  };
  function modeWeights(mode) {
    const base = WEIGHTS.seimbang; if (mode === 'seimbang') return base;
    const key = { termurah: 'cost', ringan: 'health', reputasi: 'rep' }[mode];
    if (!key) return base;
    const rest = 1 - base[key]; const w = {};
    Object.keys(base).forEach(k => w[k] = k === key ? 0.5 : base[k] * 0.5 / rest);
    return w;
  }
  function speedScore(hours) { if (hours == null) return 0.5; if (hours <= 24) return 1; if (hours <= 48) return 0.8; if (hours <= 72) return 0.6; return 0.3; }

  function match(p, { amount, deadlineHours, purpose = 'konsumtif', mode = 'seimbang', products }) {
    const h = headroom(p);
    const rows = [];
    products.forEach(pr => {
      const row = { ...pr };
      if (pr.illegal) { row.status = 'blocked'; row.reason = 'Tidak berizin OJK (daftar Satgas PASTI)'; rows.push(row); return; }
      if (pr.requires && !p.access?.[pr.requires]) { row.status = 'na'; row.reason = pr.requiresWhy; rows.push(row); return; }
      if (pr.unavailable) { row.status = 'filtered'; row.reason = pr.unavailable; rows.push(row); return; }
      if (amount < pr.min || amount > pr.max) { row.status = 'filtered'; row.reason = `Plafon ${rpShort(pr.min)}–${rpShort(pr.max)}`; rows.push(row); return; }
      if (pr.purpose && pr.purpose !== purpose) { row.status = 'filtered'; row.reason = pr.purpose === 'produktif' ? 'Khusus pinjaman usaha (produktif)' : 'Khusus pinjaman konsumtif'; rows.push(row); return; }
      const L = loan({ principal: amount, rate: pr.rate, unit: pr.unit, months: pr.months, feePct: pr.feePct || 0, maxTotal: pr.maxTotalPct != null ? amount * pr.maxTotalPct : undefined });
      Object.assign(row, L);
      const z = zoneOf(p, L.inst); Object.assign(row, z);
      if (pr.hours != null && pr.hours > deadlineHours) { row.status = 'filtered'; row.reason = `Cair ±${hoursLabel(pr.hours)}, lewat tenggatmu`; rows.push(row); return; }
      row.status = 'ok'; rows.push(row);
    });
    const ok = rows.filter(r => r.status === 'ok');
    const minC = Math.min(...ok.map(r => r.total)), maxC = Math.max(...ok.map(r => r.total));
    const w = modeWeights(mode);
    ok.forEach(r => {
      const f = {};
      f.cost = maxC > minC ? 1 - (r.total - minC) / (maxC - minC) : 1;
      if (r.zone === 'safe') f.health = 0.6 + 0.4 * (h.ceiling ? clamp(1 - r.inst / h.ceiling, 0, 1) : 0);
      else if (r.zone === 'stretch') f.health = 0.3 * clamp(1 - (r.inst - h.ceiling) / Math.max(1, h.sur - h.ceiling), 0, 1);
      else f.health = 0;
      f.rep = r.rating ? (r.rating / 5) * 0.5 + (r.positive || 0) * 0.5 : 0.7;
      f.privacy = (r.privacy ?? 7) / 10;
      f.speed = speedScore(r.hours);
      r.factors = f;
      r.score = sum(Object.keys(w), k => w[k] * f[k]);
    });
    const allDanger = ok.length > 0 && ok.every(r => r.zone === 'danger');
    const by = {
      termurah: (a, b) => a.total - b.total || a.inst - b.inst,
      ringan: (a, b) => a.inst - b.inst || a.total - b.total,
      reputasi: (a, b) => (b.rating || 0) - (a.rating || 0) || a.total - b.total,
      // when nothing is safe, the least harmful option is the one that leaves the smallest monthly shortfall
      seimbang: allDanger ? (a, b) => b.left - a.left || a.total - b.total : (a, b) => b.score - a.score,
    }[mode] || ((a, b) => b.score - a.score);
    // safer zones always come first; the chosen mode orders options inside each zone
    const tier = { safe: 0, stretch: 1, danger: 2 };
    ok.sort((a, b) => tier[a.zone] - tier[b.zone] || by(a, b));
    ok.forEach((r, i) => r.rank = i + 1);
    // only compare against "the fastest" when every option publishes its speed
    const fastest = ok.some(r => r.hours == null) ? null : [...ok].sort((a, b) => a.hours - b.hours)[0];
    const best = ok[0];
    return { rows, ok, weights: w, fastest, best, h, allDanger };
  }
  function hoursLabel(h) { if (h == null) return 'tidak dipublikasikan'; if (h < 1) return Math.round(h * 60) + ' menit'; if (h < 24) return Math.round(h) + ' jam'; return Math.round(h / 24) + ' hari'; }

  /* OJK caps on daily economic benefit (SEOJK 19/SEOJK.06/2025): consumer 0.3%/day <=6 mo, 0.2%/day >6 mo; productive 0.275%/day <=Rp50 jt, 0.1%/day above */
  function ojkCap(purpose, months, amount) {
    if (purpose === 'produktif') return amount > 50e6 ? 0.001 : 0.00275;
    return months > 6 ? 0.002 : 0.003;
  }

  /* ---------- PULIH: repayment routing ---------- */
  // remaining principal of a loan: with a rate the user entered, the present value of the remaining instalments;
  // without one, the remaining payments themselves (interest is already inside the instalment)
  function loanBalance(l) {
    const n = l.months || 0, r = l.rateIn > 0 ? l.rateIn : 0;
    return r ? l.instalment * (1 - Math.pow(1 + r, -n)) / r : l.instalment * n;
  }
  function route(loans, extra, method) {
    // interest is only simulated for loans whose rate the user entered; guessed rates only decide the avalanche order
    let L = loans.map(l => ({ ...l, bal: loanBalance(l), rateMonthly: l.rateIn > 0 ? l.rateIn : 0, orderRate: l.rateMonthly || 0 }));
    let month = 0, interestPaid = 0; const payoff = {};
    while (L.some(l => l.bal > 1) && month < 240) {
      month++;
      let pool = extra;
      L.forEach(l => { if (l.bal <= 1) return; const i = l.bal * (l.rateMonthly || 0); interestPaid += i; l.bal += i; const pay = Math.min(l.bal, l.instalment); l.bal -= pay; });
      // freed instalments of paid-off loans roll into the pool
      L.forEach(l => { if (l.bal <= 1 && payoff[l.id] === undefined) payoff[l.id] = month; });
      pool += sum(L.filter(l => payoff[l.id] !== undefined && payoff[l.id] < month), l => l.instalment);
      const order = L.filter(l => l.bal > 1).sort(method === 'avalanche' ? (a, b) => b.orderRate - a.orderRate : (a, b) => a.bal - b.bal);
      for (const l of order) { if (pool <= 0) break; const pay = Math.min(pool, l.bal); l.bal -= pay; pool -= pay; if (l.bal <= 1 && payoff[l.id] === undefined) payoff[l.id] = month; }
    }
    return { months: month, interest: interestPaid, interestKnown: L.some(l => l.rateMonthly > 0), payoff,
      order: (method === 'avalanche' ? [...loans].sort((a, b) => (b.rateMonthly || 0) - (a.rateMonthly || 0)) : [...loans].sort((a, b) => loanBalance(a) - loanBalance(b))).map(l => l.id) };
  }

  function ringFence(p) {
    // amount to set aside from each income event so every instalment is covered before its due date
    const inc = [...p.incomes].sort((a, b) => (a.payday || 1) - (b.payday || 1));
    return p.loans.map(l => ({ ...l })).sort((a, b) => a.dueDay - b.dueDay);
  }

  return { rp, rpShort, pct, income, instalments, needs, wants, spendTotal, surplus, headroom, zoneOf, loan, health, readiness, maxSafeLoan, loanBalance, SAFE_RATE,

})();

function monthStrip(markers) {
  const sorted = [...markers].sort((a, b) => a.day - b.day);
  const desc = 'Peta tanggal: ' + sorted.map(m => `tanggal ${m.day} ${m.label}`).join(', ');
  // markers on the same day share one dot; labels that would collide drop to a second row under the dates
  const groups = []; sorted.forEach(m => { const g = groups.find(x => x.day === m.day); if (g) g.items.push(m); else groups.push({ day: m.day, items: [m] }); });
  let lastTop = -99, low = false;
  const html = groups.map(g => {
    const x = ((g.day - 0.5) / 30 * 100).toFixed(2), label = g.items.map(m => m.label).join(' + ');
    low = g.day - lastTop < 4 + label.length / 3 ? !low : false; if (!low) lastTop = g.day;
    return `<div class="mk" style="left:${x}%;background:${g.items[0].color}"></div><div class="tx${low ? ' low' : ''}${g.day <= 4 ? ' l' : g.day >= 27 ? ' r' : ''}" style="left:${x}%;color:${g.items.length > 1 ? 'var(--ink)' : g.items[0].color}">${esc(label)}</div><div class="dd" style="left:${x}%">${g.day}</div>`;
  }).join('');
  return `<div class="month${groups.some((g, i) => i && g.day - groups[i - 1].day < 4 + groups[i].items.map(m => m.label).join(' + ').length / 3) ? ' two' : ''}" role="img" aria-label="${esc(desc)}"><div class="ln"></div>${html}</div>`;
}

  const max = Math.max(h.stretchMax * 1.25, h.ceiling * 1.6, 100000, mark ? mark * 1.1 : 0);
  const a = h.ceiling / max * 100, b = Math.max(0, h.stretchMax - h.ceiling) / max * 100, c = 100 - a - b;
  return `<div class="zbar" aria-hidden="true"><i style="width:${a}%;background:var(--safe)"></i><i style="width:${b}%;background:var(--stretch)"></i><i style="width:${c}%;background:var(--danger)"></i></div>

const RL = REAL.lenders;
const nf = (x, d = 2) => Number(x).toLocaleString('id-ID', { maximumFractionDigits: d });
const dateID = iso => { const [y, m, d] = String(iso).split('-').map(Number); return (d ? d + ' ' : '') + ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'][(m || 1) - 1] + ' ' + y; };

const REV_TO = RL.filter(l => l.reviews).map(l => l.reviews.to).sort().pop();

function rateInfo(l) {
  if (l.rateIsMin) return { daily: null, label: `mulai ${nf(l.monthly)}%/bulan`, min: true };
  if (l.dailyMax) return { daily: l.dailyMax / 100, label: `maks ${nf(l.dailyMax)}%/hari` };
  if (l.monthly) return { daily: l.monthly / 100 / 30, label: `${nf(l.monthly)}%/bulan` };
  if (l.aprMax) return { daily: l.aprMax / 100 / 365, label: `maks ${nf(l.aprMax)}%/tahun` };
  return null;
}
const adminFee = (l, months) => l.adminPct == null ? 0 : (l.adminUnit === 'month' ? l.adminPct / 100 * months : l.adminPct / 100);
const kindLabel = l => l.kind === 'Syariah' ? 'Syariah · produktif' : l.purpose === 'both' ? 'Konsumtif & produktif' : l.purpose === 'produktif' ? 'Produktif (usaha)' : 'Konsumtif';
// maximum legal cost of borrowing Rp1 jt for 3 months, from the published (RIPLAY) rate + admin, capped by OJK
function sampleCost(l) {
  const ri = rateInfo(l); if (!ri || ri.daily == null) return null;
  const cap = FW.ojkCap(l.purpose === 'produktif' ? 'produktif' : 'konsumtif', 3, 1e6);
  return Math.round(1e6 * Math.min(ri.daily * 90 + adminFee(l, 3), cap * 90, 1));
}
// Smart Loan Match products for "Data saya": real licensed lenders, priced at their published maximum
function realProducts(st, amount) {
  const months = st.months || 0, purpose = st.purpose || 'konsumtif';
  const generic = DATA.products.filter(x => x.id === 'koperasi' || x.id === 'bank').map(x => ({ ...x, months: months || x.months, generic: true }));
  const real = RL.map(l => {
    const ri = rateInfo(l);
    const base = { id: 'r-' + l.id, real: l.id, name: l.name, kind: 'pindar', legal: 'Berizin OJK', hours: null, min: l.min || 0, max: l.max || Infinity,
      rating: l.reviews?.avg, positive: l.reviews?.pos, privacy: 7 + (l.iso27001 ? 1.5 : 0) + (l.iso27701 ? 1.5 : 0), months, unit: 'day' };
    if (l.purpose !== 'both') base.purpose = l.purpose;
    if (!ri || ri.daily == null) return { ...base, rate: 0, unavailable: 'Biaya maksimum tidak dipublikasikan lengkap' };
    const days = months * 30;
    if (l.tenorMinDays && days + 5 < l.tenorMinDays) return { ...base, rate: ri.daily, unavailable: `Tenor minimal ±${Math.round(l.tenorMinDays / 30)} bulan` };
    if (l.tenorMaxDays && days - 5 > l.tenorMaxDays) return { ...base, rate: ri.daily, unavailable: `Tenor maksimal ±${Math.round(l.tenorMaxDays / 30)} bulan` };
    const cap = FW.ojkCap(purpose, months, amount);
    return { ...base, rate: ri.daily, feePct: adminFee(l, months), maxTotalPct: Math.min(cap * days, purpose === 'konsumtif' ? 1 : Infinity),
      rateLabel: ri.label, note: l.adminPct ? `admin ${l.adminUnit === 'month' ? nf(l.adminPct) + '%/bulan' : 'hingga ' + nf(l.adminPct) + '%'}` : '' };
  });
  const ill = REAL.illegal.map(i => ({ id: 'x-' + i.short.toLowerCase().replace(/\W/g, ''), name: i.short, kind: 'ilegal', illegal: true }));
  return [...generic, ...real, ...ill];
}
// for "Data saya", want categories above the 50/30/20 guideline get a suggested cap (same rule for everyone, no guessing)
function autoCaps(p0) {
  const p = clone(p0), inc = FW.income(p), w = FW.wants(p);
  if (!inc || w <= 0.30 * inc) return p;
  const f = 0.30 * inc / w;
  p.spending.forEach(c => { if (c.kind === 'want' && c.amount > 0) { c.cap = Math.floor(c.amount * f / 10000) * 10000; c.capWhy = 'Agar total keinginan ≤30% pendapatan (pedoman 50/30/20)'; } });
  return p;
}

function wizValidate(step, p) {

    });

  }

    if (!p.spendMode) e.spendMode = 'Pilih cara mengisi pengeluaran.';
    else if (p.spendMode === 'total') { if (!(p.totalSpend > 0)) e.totalSpend = 'Isi perkiraan total pengeluaranmu per bulan.'; }
    else {
      p.items.forEach((c, i) => {
        if (c.amount == null) e[`items.${i}.amount`] = 'Wajib diisi. Tulis 0 jika tidak ada.';
        if (c.day != null && !okDay(c.day)) e[`items.${i}.day`] = 'Tanggal 1–31.';
        if (c.custom && !String(c.name || '').trim()) e[`items.${i}.name`] = 'Beri nama pos ini.';
      });
      if (!Object.keys(e).length && !p.items.some(c => c.amount > 0)) e._step = 'Semua pos bernilai 0. Isi minimal satu pengeluaran.';
    }
    if (p.familyAns == null) e.familyAns = 'Pilih Ya atau Tidak.';

        if (!l.type) e[`loans.${i}.type`] = 'Pilih jenis.';

        if (!okDay(l.dueDay)) e[`loans.${i}.dueDay`] = 'Tanggal 1–31.';

}

}
function meters(f) {

    m.push({ k: 'Kebutuhan pokok + keluarga', v: f.needR, txt: pct(f.needR, 0), target: 'pedoman ≤50%', s: st(f.needR <= 0.5, f.needR <= 0.7) });
    m.push({ k: 'Keinginan / gaya hidup', v: f.wantR, txt: pct(f.wantR, 0), target: 'pedoman ≤30%', s: st(f.wantR <= 0.3, f.wantR <= 0.4) });
  }
  m.push({ k: 'Porsi cicilan', v: f.dsr, txt: pct(f.dsr, 0), target: 'aman ≤30%, bahaya >40%', s: st(f.dsr <= 0.3, f.dsr <= 0.4), term: 'DSR' });
  m.push({ k: 'Sisa uang', v: Math.max(0, f.surR), txt: f.sur < 0 ? 'tekor' : pct(f.surR, 0), target: 'pedoman ≥20%', s: st(f.surR >= 0.2, f.surR >= 0.1), invert: true });
  m.push({ k: 'Dana darurat', v: Math.min(1, f.efMonths / f.efTarget), txt: f.efMonths.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' bulan', target: `target ${f.efTarget} bulan${f.unstable ? ' (penghasilan tidak stabil)' : ''}`, s: st(f.efMonths >= f.efTarget, f.efMonths >= 1), invert: true, term: 'Dana darurat' });

const CALC_TYPES = [['konsumtif', 'Konsumtif'], ['mikro', 'Produktif ≤ Rp50 jt'], ['umkm', 'Produktif > Rp50 jt']];
function calcState() {
  if (!S.calc) S.calc = { type: 'konsumtif', mode: 'ojk', amount: S.pilah?.need || 5000000, months: S.pilah?.months || 6, rate: null, unit: 'day', admin: null, lateOn: false, lateRate: null, lateDays: null, lender: null };
  return S.calc;
}
function calcNumbers(c) {
  const purpose = c.type === 'konsumtif' ? 'konsumtif' : 'produktif';
  const amount = c.type === 'umkm' ? Math.max(c.amount, 50000001) : c.type === 'mikro' ? Math.min(c.amount, 50000000) : c.amount;
  const cap = FW.ojkCap(purpose, c.months, amount);
  const rate = c.mode === 'ojk' ? cap : (c.rate || 0), unit = c.mode === 'ojk' ? 'day' : c.unit;
  const maxTotal = amount * Math.min(cap * c.months * 30, purpose === 'konsumtif' ? 1 : Infinity);
  // OJK mode shows the legal maximum; a manual offer is shown as quoted (an offer above the cap is itself a warning sign)
  const L = FW.loan({ principal: amount, rate, unit, months: c.months, feePct: c.mode === 'manual' ? (c.admin || 0) : 0, maxTotal: c.mode === 'ojk' ? maxTotal : undefined });
  const daily = unit === 'day' ? rate : rate / 30, overCap = c.mode === 'manual' && daily > cap + 1e-9;
  return { purpose, amount, cap, rate, unit, L, overCap };
}
// cash-flow projection: money left each month while the loan runs
function projectionChart(p, inst, months) {
  const sur = FW.surplus(p), n = Math.min(Math.max(months, 1), 12), vals = Array.from({ length: n }, () => sur - inst);
  const max = Math.max(1, ...vals.map(Math.abs), inst), W = 560, H = 170, bw = W / n, mid = vals.some(v => v < 0) ? H * 0.6 : H - 22;
  const y = v => v >= 0 ? mid - (v / max) * (mid - 12) : mid + (-v / max) * (H - 24 - mid);
  const bars = vals.map((v, i) => `<rect x="${(i * bw + bw * 0.18).toFixed(1)}" y="${Math.min(y(v), mid).toFixed(1)}" width="${(bw * 0.3).toFixed(1)}" height="${Math.abs(y(v) - mid).toFixed(1)}" rx="3" fill="${v < 0 ? 'var(--danger)' : 'var(--safe)'}"/><rect x="${(i * bw + bw * 0.52).toFixed(1)}" y="${y(inst).toFixed(1)}" width="${(bw * 0.3).toFixed(1)}" height="${(mid - y(inst)).toFixed(1)}" rx="3" fill="var(--amber-strong)"/><text x="${(i * bw + bw / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="11" fill="var(--muted)">Bln ${i + 1}</text>`).join('');
  return `<figure class="chart" style="margin:0"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Proyeksi ${n} bulan: cicilan ${rp(inst)} per bulan, sisa uang ${rp(sur - inst, { plus: true })} per bulan">${bars}<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line)"/></svg>

function parseStatement(txt) {
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const out = { income: 0, internal: 0, cats: {}, n: 0 };
  lines.forEach(l => {
    const parts = l.split(/[;,\t]/); const amtStr = [...parts].reverse().find(x => /-?\d[\d.]*\d|^-?\d+$/.test(x.replace(/\s/g, '')));
    if (!amtStr) return; let amt = Number(amtStr.replace(/[^\d-]/g, '')); if (!amt) return;
    if (/\bDB\b|debit/i.test(l) && amt > 0) amt = -amt;
    const desc = parts.filter(x => x !== amtStr).join(' ');
    if (/top ?up|isi saldo|pindah dana|ke rekening sendiri/i.test(desc)) { out.internal += Math.abs(amt); return; }
    if (amt > 0) { out.income += amt; return; }
    const c = CATS.find(c => c[2].test(desc)) || ['Lainnya', 'want'];
    out.cats[c[0]] = out.cats[c[0]] || { name: c[0], kind: c[1], amount: 0 }; out.cats[c[0]].amount += -amt; out.n++;
  });
  return out;
}

    if (r.income && !s.incomes.some(i => i.amount > 0)) s.incomes = [{ id: 'i1', label: 'Pemasukan dari mutasi', amount: r.income, type: null, payday: null }];
    S.overlay = null; persist();
    if (S.route !== 'mulai') { S.personaId = 'saya'; resetStageState(); if (!s.setup) { S.wiz.step = 2; location.hash = '#mulai'; } }
    toast('Pengeluaran dari mutasi dipakai untuk “Data saya”. Periksa lagi angkanya.');
  },
  copy: async el => { const src = document.getElementById(el.dataset.src); const txt = src?.value ?? src?.textContent ?? ''; try { await navigator.clipboard.writeText(txt); toast('Tersalin'); } catch { if (src?.select) { src.classList.remove('sr'); src.select(); } toast('Tekan Ctrl/⌘+C untuk menyalin'); } },
  ai: el => askAI(el.dataset.key, el.dataset.prompt),
  chat: () => { S.drawer = { tab: 'chat' }; render(); setTimeout(() => document.getElementById('chat-in')?.focus(), 0); },
  'chat-q': el => sendChat(el.dataset.q),
  lender: (el, e) => { e?.preventDefault?.(); const id = LIC.some(l => l.id === el.dataset.id) ? el.dataset.id : (LIC.find(l => l.d?.id === el.dataset.id) || {}).id; if (!id) return; S.os.lender = id; S.os.found = el.dataset.found ? id : null; S.os.reviewPreview = ''; S.os.rv = {}; S.os.rvErr = ''; if (S.route !== 'pinjol') location.hash = '#pinjol'; else { lastRoute = null; render(); lastRoute = 'pinjol'; window.scrollTo(0, 0); } },
  'os-illegal': el => { const i = S.os.result?.ill?.[+el.dataset.v]; if (i) { S.os.result = { kind: 'illegal', item: i }; render(); } },
  'os-pick-ill': el => { const i = ILL[+el.dataset.v]; if (i) showLookup({ kind: 'illegal', item: i }); },
  'os-set': el => { S.os[el.dataset.f] = el.dataset.v; render(); },
  cmp: el => { const id = el.dataset.id, c = S.os.cmp; if (c.includes(id)) S.os.cmp = c.filter(x => x !== id); else { if (c.length >= 3) toast('Maksimal 3 pinjol; yang pertama dikeluarkan'); S.os.cmp = [...c, id].slice(-3); announce(`${licById(id)?.name} masuk perbandingan`); } store.set('cmp', S.os.cmp); render(); },
  'il-more': () => { S.os.ilN += 60; render(); },
  calc: el => { const c = calcState(); c[el.dataset.f] = el.dataset.v; if (el.dataset.f === 'type' && el.dataset.v === 'umkm' && c.amount <= 50000000) c.amount = 100000000; if (el.dataset.f === 'type' && el.dataset.v !== 'umkm' && c.amount > 50000000) c.amount = 50000000; render(); },
  'calc-set': el => { Object.assign(calcState(), JSON.parse(el.dataset.v)); render(); window.scrollTo({ top: 0 }); announce('Kalkulator diperbarui'); },
  'calc-to-pilah': () => { const c = calcState(); Object.assign(S.pilah, { need: c.amount, months: c.months, purpose: c.type === 'konsumtif' ? 'konsumtif' : 'produktif', step: 2 }); },
  'calc-lender': el => { const l = licById(el.dataset.id), d = l?.d, ri = d && rateInfo(d); if (!ri || ri.daily == null) return; Object.assign(calcState(), { mode: 'manual', rate: ri.daily, unit: 'day', admin: d.adminPct != null && d.adminUnit !== 'month' ? d.adminPct / 100 : null, lender: l.name, type: d.purpose === 'produktif' ? 'mikro' : 'konsumtif' }); },
  print: () => window.print(),
  glossary: el => { S.drawer = { tab: 'kamus', term: el.dataset.v || null, q: '' }; render(); },
  ai3: el => askAI(el.dataset.key, el.dataset.prompt, { json: true }),
  // test mode
  't-start': () => { S.test = newTest(); if (location.hash !== '#main') location.hash = '#main'; render(); window.scrollTo(0, 0); },
  't-quit': () => { S.test = null; location.hash = '#home'; },
  't-next': () => { const t = S.test; if (t.stage === 2) t.taskEnd = Date.now(); t.stage++; t.hint = ''; render(); window.scrollTo({ top: 0 }); },
  't-step': el => { const t = S.test; if (el.dataset.mark) t.marks[el.dataset.mark] = true; t.st.step = +el.dataset.v; t.hint = ''; render(); window.scrollTo({ top: 0 }); },
  't-help': () => { const t = S.test; t.help++; t.hint = DATA.hints[['headroom', 'ladder', 'match'][t.st.step - 1]]; render(); },
  't-fb': el => { const f = S.test.feedback; f[el.dataset.f] = el.dataset.f === 'help' ? el.dataset.v : +el.dataset.v; render(); },
  't-finish': async () => { const t = S.test; t.endedAt = Date.now(); t.stage = 5; const rec = testRecord(t); t.saved = (S.cap.canWrite && S.cap.team) ? 'saving' : 'code'; render(); if (t.saved === 'saving') { t.saved = (await saveTest(rec)) ? 'db' : 'code'; render(); } },
  'import-code': async () => { const v = document.getElementById('imp-code').value; try { const rec = decodeRecord(v); const ok = await saveTest(rec); S.importMsg = ok ? 'Hasil tersimpan.' : 'Gagal menyimpan. Pastikan kamu pemilik/editor.'; } catch { S.importMsg = 'Kode tidak valid. Pastikan disalin utuh, diawali FW1.'; } render(); },
};
const CHG = {
  persona: () => {},
  ack: el => { S.overlay.ack = el.checked; render(); },
  quiz: el => { S.test[el.dataset.set][+el.dataset.i] = +el.value; render(); },
  't-field': el => { const t = S.test; const f = el.dataset.f; if (f === 'consent') t.consent = el.checked; else if (f === 'comment') t.feedback.comment = el.value; else t[f] = el.value; render(); },
  'pilah-ackbox': el => { S.pilah.ackBox = el.checked; queueRender(); },
  'plan-toggle': el => { S.cek.off = S.cek.off || {}; S.cek.off[el.dataset.id] = !el.checked; queueRender(); },
  'calc-late': el => { calcState().lateOn = el.checked; render(); },
  'cmp-add': el => { if (el.value) { S.os.cmp = [...S.os.cmp.filter(x => x !== el.value), el.value].slice(-3); store.set('cmp', S.os.cmp); render(); } },
  'pulih-toggle': el => { S.pulih[el.dataset.k] = el.checked; render(); },
  'imp-file': el => { const f = el.files?.[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { S.importText = String(rd.result).slice(0, 200000); S.importRes = parseStatement(S.importText); render(); }; rd.readAsText(f); },
};
async function sendChat(q) {
  q = (q || '').trim(); if (!q || S.chatBusy) return;
  if (!S.cap.sample) { S.chat.push({ role: 'user', content: q }, { role: 'assistant', content: ruleAnswer(q) || 'Pertanyaan bebas belum bisa dijawab di versi ini. Coba pertanyaan cepat di atas atau lihat Kamus istilah.' }); S.drawer = S.drawer || { tab: 'chat' }; render(); return; }
  S.chat.push({ role: 'user', content: q }); S.chat.push({ role: 'assistant', content: 'Sedang berpikir…' }); S.chatBusy = true; render();
  const turns = [{ role: 'user', content: AI_RULES + '\n\nData pengguna:\n' + context() + '\n\nJawab pertanyaan berikutnya berdasarkan data ini.' }, ...S.chat.slice(0, -1).slice(-8)];
  try {
    const { text } = await S.cap.sample(turns, { cache: false, onText: ({ text }) => { S.chat[S.chat.length - 1].content = text; const el = document.getElementById('chat-last'); if (el) el.textContent = text; } });
    S.chat[S.chat.length - 1].content = text;
  } catch (e) { if (HIDE.includes(e?.code)) S.cap.sample = null; S.chat[S.chat.length - 1].content = e?.text || AI_ERR[e?.code] || 'AI belum bisa menjawab sekarang.'; }
  S.chatBusy = false; render();
}

document.addEventListener('click', e => {
  const sg = e.target.closest('[data-sug]'); if (sg) { const ul = sg.closest('.sugg'); pickSug(document.getElementById(ul.id.replace(/-list$/, '')), +sg.dataset.sug); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'close-bg' && e.target !== el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.dataset.act === 'close-bg') e.preventDefault();
  if (el.tagName === 'A' && el.getAttribute('href')?.startsWith('#')) { fn(el, e); return; }
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.target.matches?.('[data-sug-input]')) {
    const inp = e.target, open = sugList(inp) && !sugList(inp).hidden;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!open) renderSug(inp); else moveSug(inp, e.key === 'ArrowDown' ? 1 : -1); return; }
    if (e.key === 'Enter' && open && SUG.active >= 0) { e.preventDefault(); pickSug(inp, SUG.active); return; }
    if (e.key === 'Escape' && open) { e.preventDefault(); closeSug(inp); return; }
  }
  if (e.key === 'Escape' && S.overlay) { S.overlay = null; render(); }
  else if (e.key === 'Escape' && S.drawer) { S.drawer = null; render(); document.querySelector('[data-act="drawer"]')?.focus(); }
  if (e.key === 'Enter' && e.target.matches('tr[data-act]')) ACT[e.target.dataset.act]?.(e.target, e);
  if (e.key === 'Enter' && e.target.matches('input[data-k],input[data-pf],input[data-sy]:not([type=radio])')) { e.preventDefault(); e.target.dispatchEvent(new Event('change', { bubbles: true })); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange) { CHG[el.dataset.actChange]?.(el, e); return; }
  if (el.dataset.k) {
    const path = el.dataset.k; const val = parseVal(el);
    if (path.startsWith('t.')) setPath(S.test.st, path.slice(2), val); else setPath(S, path, val);
    if (path === 'pilah.need' || path === 't.need') { const st = path === 't.need' ? S.test.st : S.pilah; if (st.useSavings != null && st.need != null) st.useSavings = Math.min(st.useSavings, st.need); }
    queueRender(); return;
  }
  if (el.dataset.pf) { setPath(P(), el.dataset.pf, parseVal(el)); persist(); queueRender(); return; }
  if (el.dataset.sy) {
    const p = S.profiles.saya, path = el.dataset.sy; setPath(p, path, parseVal(el));
    if (path === 'hasLoans' && p.hasLoans && !p.loans.length) p.loans.push({ id: 'l' + Date.now(), name: '', type: '', instalment: null, dueDay: null, months: null, rateIn: null });
    if (path === 'familyAns' && !p.familyAns) p.family = null;
    if (p.setup) wizFinalizeLight(p);
    delete S.wiz.errors[path]; if (S.wiz.errors._step && Object.keys(S.wiz.errors).length === 1) delete S.wiz.errors._step;
    persist(); queueRender(); return;
  }
  if (el.dataset.rv) { S.os.rv[el.dataset.rv] = el.value; if (el.type === 'radio') { S.os.rvErr = ''; } }
});
let liveTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset?.rv && el.type !== 'radio') S.os.rv[el.dataset.rv] = el.value;
  // sliders: update the number next to them while dragging, full recalculation on release
  if (el.type === 'range' && el.dataset.k) { const v = parseVal(el); setPath(S, el.dataset.k, v); const b = el.parentElement?.querySelector('.row b.num'); if (b) b.textContent = el.dataset.k === 'calc.months' ? v + ' bulan' : rp(v); }
  // live search boxes
  if (el.dataset?.live === 'kamus') { S.drawer.q = el.value; clearTimeout(liveTimer); liveTimer = setTimeout(queueRender, 150); }
  if (el.matches?.('[data-sug-input]')) { if (el.id === 'osq') S.os.q = el.value; else S.os.qc = el.value; renderSug(el); }
  if (el.id === 'listq' || el.id === 'ilq') { setPath(S, el.dataset.k, el.value); if (el.id === 'ilq') S.os.ilN = 60; clearTimeout(liveTimer); liveTimer = setTimeout(queueRender, 180); }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'quickcheck' || f === 'oscheck') { const inp = e.target.querySelector('[data-sug-input]'); const q = inp ? inp.value : ''; closeSug(inp); S.os.q = q; showLookup(lookup(q)); }
  if (f === 'addloan') { const p = P(); const name = document.getElementById('nl-name').value.trim(); const inst = digits(document.getElementById('nl-inst').value); if (!name || !inst) { toast('Isi nama dan cicilan'); return; } const months = +document.getElementById('nl-months').value || 1; p.loans.push({ id: 'l' + Date.now(), name, type: 'lainnya', instalment: inst, outstanding: inst * months, months, dueDay: Math.min(31, Math.max(1, +document.getElementById('nl-due').value || 1)), rateMonthly: 0.02 }); if (isSaya(p)) p.hasLoans = true; persist(); render(); }
  if (f === 'chat') { const v = document.getElementById('chat-in').value; sendChat(v); }
  if (f === 'review') {
    const v = S.os.rv || {};
    if (!v.collection || !v.fees) { S.os.rvErr = 'Pilih nilai 1–5 untuk cara penagihan dan keterbukaan biaya.'; render(); document.querySelector('[data-rv="collection"]')?.focus(); return; }
    if (!String(v.text || '').trim() && !digits(v.amount || '')) { S.os.rvErr = 'Tulis cerita singkat atau isi jumlah pinjaman.'; render(); document.getElementById('rv-text')?.focus(); return; }
    S.os.rvErr = '';
    const rec = { lender: S.os.lender, amount: digits(v.amount || ''), months: +v.months || 0, paid: digits(v.paid || ''), collection: +v.collection, fees: +v.fees, text: String(v.text || '').slice(0, 400), at: new Date().toISOString() };
    if (S.cap.db && S.cap.canWrite) { S.cap.db.collection('reviews').add(rec).then(() => toast('Ulasan terkirim'), () => toast('Ulasan gagal dikirim')); S.os.reviewPreview = ''; S.os.rv = {}; render(); }
    else { S.os.reviewPreview = `${rec.amount ? rp(rec.amount) : ''} ${rec.months ? rec.months + ' bln' : ''} · penagihan ${rec.collection}/5 · transparansi ${rec.fees}/5 · ${rec.text}`; render(); }
  }

});
window.addEventListener('hashchange', route);
route();
initCaps();
})();
</script>
